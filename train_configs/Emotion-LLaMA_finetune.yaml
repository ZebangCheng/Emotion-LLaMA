model:
  arch: minigpt_v2
  model_type: pretrain
  max_txt_len: 1024
  image_size: 448
  end_sym: "</s>"
  llama_model: "/home/user/project/Emotion-LLaMA/checkpoints/Llama-2-7b-chat-hf"

  ckpt: "/home/user/project/Emotion-LLaMA/checkpoints/minigptv2_checkpoint.pth"

  use_grad_checkpoint: True
  chat_template: True
  lora_r: 64
  lora_alpha: 16


datasets:    
  feature_face_caption:
    batch_size: 1
    task_pool: [emotion, reason]
    evaluation_task: emotion
    labels: [neutral, angry, happy, sad, worried, surprise]
    annotation_format: auto
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
      eval:
        name: "blip2_image_eval"
        image_size: 448
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
    sample_ratio: 30
    build_info:
      image_path: /path/to/MER2023/video
      ann_path: /path/to/MER2023/MERR_coarse_grained.txt
      transcription_path: transcription_en_all.csv
      coarse_grained_json_path: MERR_coarse_grained.json
      face_feature_path: mae_340_UTT
      video_feature_path: maeV_399_UTT
      audio_feature_path: HL-UTT

run:
  task: image_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  # init_lr: 1e-5
  # min_lr: 8e-5
  # warmup_lr: 1e-6

  init_lr: 1e-5
  min_lr: 1e-6
  warmup_lr: 1e-6

  # init_lr: 1e-6
  # min_lr: 1e-6
  # warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 30
  num_workers: 6
  # iters_per_epoch: 5000
  iters_per_epoch: 1000


  warmup_steps: 1000

  seed: 42
  output_dir: "/home/user/project/Emotion-LLaMA/checkpoints/save_checkpoint"

  amp: True
  resume_ckpt_path: null

  # evaluate=True is test-only mode. Training-time validation is controlled by
  # valid_splits and stays disabled until a val annotation is configured.
  evaluate: False
  train_splits: ["train"]
  valid_splits: []
  test_splits: []
  metric_for_best_model: macro_f1
  best_model_split: null
  greater_is_better: True
  early_stopping_patience: null
  early_stopping_min_delta: 0.0
  evaluation:
    task: classification
    labels: [neutral, angry, happy, sad, worried, surprise]
    generation:
      max_new_tokens: 20
      num_beams: 1
      do_sample: False

  device: "cuda"
  world_size: 2
  dist_url: "env://"
  distributed: True

  wandb_log: False
  job_name: minigptv2_finetune
