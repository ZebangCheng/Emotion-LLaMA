model:
  arch: minigpt_v2
  model_type: pretrain
  max_txt_len: 500
  end_sym: "</s>"
  low_resource: False
  prompt_template: '[INST] {} [/INST]'
  llama_model: "/home/user/project/Emotion-LLaMA/checkpoints/Llama-2-7b-chat-hf"
  ckpt: "/home/user/project/Emotion-LLaMA/checkpoints/save_checkpoint/stage2/checkpoint_best.pth"
  lora_r: 64
  lora_alpha: 16

datasets:    
  feature_face_caption:  #
    batch_size: 1
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
      eval:
        name: "blip2_image_eval"
        image_size: 448
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
    sample_ratio: 30

evaluation_datasets:
  feature_face_caption:
    eval_file_path: /home/user/selected_face/face_emotion/relative_test3_NCEV.txt # MER2023

    img_path: /home/czb/big_space/datasets/Emotion/MER2023/video
    task_pool: [emotion]
    # Keep this benchmark's historical six-class metric contract explicit.
    labels: [neutral, angry, happy, sad, worried, surprise]
    annotation_format: auto
    transcription_path: transcription_en_all.csv
    face_feature_path: mae_340_UTT
    video_feature_path: maeV_399_UTT
    audio_feature_path: HL-UTT

    max_new_tokens: 500
    batch_size: 1

  # DFEW zero-shot. Run with --dataset dfew --zero_shot and a checkpoint that
  # was not fine-tuned on DFEW. Relative feature paths resolve against the
  # directory holding eval_file_path. See docs/evaluation/dfew-zero-shot.md;
  # the label order and the omitted transcription_path are part of the recipe.
  dfew:
    eval_file_path: /path/to/DFEW/reltive_DFEW_set_1_test.txt
    img_path: /path/to/DFEW/video
    task_pool: [emotion]
    labels: [happy, sad, neutral, angry, surprise, disgust, fear]
    annotation_format: auto
    face_feature_path: features/mae_DFEW_ck16_UTT
    video_feature_path: features/maeV_399_UTT
    audio_feature_path: features/HL-UTT
    frame_selection: middle
    # The MER2023 checkpoint answers in its own six-class vocabulary; these
    # aliases are only applied under --zero_shot.
    zero_shot_label_aliases:
      worried: fear
      anger: angry
      happiness: happy
      sadness: sad
      surprised: surprise
      disgusted: disgust
      fearful: fear
    max_new_tokens: 500
    batch_size: 1

  mer2024_caption:
    eval_file_path: /home/czb/big_space/datasets/Emotion/MER2024/MER2024-noise_NCE.txt # MER2024
    img_path: /home/czb/big_space/datasets/Emotion/MER2024/video-unlabeled-with-test2noise
    labels: [neutral, angry, happy, sad, worried, surprise, fear, contempt, doubt]
    transcription_path: transcription_all_new.csv
    face_feature_path: mae_340_23_UTT
    video_feature_path: maeVideo_399_23_UTT
    audio_feature_path: HL_23_UTT
    max_new_tokens: 500
    batch_size: 1

run:
  task: image_text_pretrain
  name: minigptv2_evaluation
  save_path: /home/user/project/Emotion-LLaMA/results
